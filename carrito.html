<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medlife | Carrito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="carrito.css">
</head>
<body>

  <!-- Header de subsección: flecha de retroceso + logo, SIN el nav principal -->
  <header class="sub-header">
    <a href="farmacia.html" class="back-arrow" aria-label="Volver">
      <svg viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19" fill="none" stroke="#1C86C4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="logo">
      <img src="assets/img/carrito/logo.png" alt="Medlife" class="logo-icon">
      <div class="logo-text">
        <span class="logo-title">MEDLIFE</span>
        <span class="logo-subtitle">VIRTUAL HEALTHCARE</span>
      </div>
    </div>
  </header>

  <div class="context-bar">
    <span class="context-text active-page">CARRITO</span>
    <div class="search-wrap">
      <input type="text" id="search-input" class="search-input" placeholder="Buscar productos, marcas..." autocomplete="off">
      <button class="search-pill" id="search-btn">
        <svg viewBox="0 0 24 24" class="search-icon"><circle cx="10" cy="10" r="6" fill="none" stroke="#fff" stroke-width="2"/><line x1="15" y1="15" x2="21" y2="21" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        BUSQUEDA
      </button>
    </div>
  </div>

  <main class="carrito-section">
    <div class="product-grid" id="cart-grid">
      <!-- Las tarjetas del carrito se generan dinámicamente con carrito.js -->
    </div>

    <p id="empty-cart-msg" class="empty-cart-msg" style="display:none;">
      Tu carrito está vacío. <a href="farmacia.html">Ir a Farmacia</a>
    </p>

    <button id="comprar-btn" class="comprar-btn">COMPRAR</button>
  </main>

  <!-- Modal de confirmación -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-box">
      <h2>Confirma tu compra</h2>
      <div id="modal-items" class="modal-items"></div>
      <div class="modal-total">
        <span>Total</span>
        <span id="modal-total-amount">$0</span>
      </div>
      <button id="confirmar-btn" class="comprar-btn">CONFIRMAR</button>
    </div>
  </div>

  <a href="ia.html" class="ia-float-btn" aria-label="Ir a IA">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="48" fill="#ffffff"/>
      <polygon points="42.0,25.0 49.1,47.9 72.0,55.0 49.1,62.1 42.0,85.0 34.9,62.1 12.0,55.0 34.9,47.9" fill="#2E9EF0"/>
      <polygon points="74.0,15.0 76.5,23.5 85.0,26.0 76.5,28.5 74.0,37.0 71.5,28.5 63.0,26.0 71.5,23.5" fill="#2E9EF0"/>
      <g fill="#2E9EF0">
        <rect x="70" y="70" width="18" height="6" rx="2"/>
        <rect x="76" y="64" width="6" height="18" rx="2"/>
      </g>
      <text x="42" y="60" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="800" font-size="20" fill="#ffffff">IA</text>
    </svg>
  </a>

  <script src="carrito.js"></script>
</body>
</html>
