<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDLIFE Virtual Healthcare</title>
  <link rel="stylesheet" href="inicio_de_sesion.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="navbar__logo">
      <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4FC3F7"/>
            <stop offset="100%" stop-color="#1E88C7"/>
          </linearGradient>
        </defs>
        <path d="M50,90 C22,66 6,46 6,29 C6,15 17,5 31,5 C41,5 47,11 50,19 C53,11 59,5 69,5 C83,5 94,15 94,29 C94,46 78,66 50,90 Z"
              fill="none" stroke="url(#logoGradient)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M36,30 L36,50 C36,58 42,64 50,64 C58,64 63,58 63,51 C63,47 60,44 56,44 C52,44 50,47 50,50"
              fill="none" stroke="url(#logoGradient)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M43,30 L43,42" fill="none" stroke="url(#logoGradient)" stroke-width="5.5" stroke-linecap="round"/>
        <circle cx="67" cy="55" r="4.5" fill="none" stroke="url(#logoGradient)" stroke-width="5"/>
      </svg>

      <div class="navbar__text">
        <span class="navbar__brand">MEDLIFE</span>
        <span class="navbar__subtitle">VIRTUAL HEALTHCARE</span>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero__overlay"></div>

    <div class="hero__content">

      <div class="hero__icon">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M50,90 C22,66 6,46 6,29 C6,15 17,5 31,5 C41,5 47,11 50,19 C53,11 59,5 69,5 C83,5 94,15 94,29 C94,46 78,66 50,90 Z"
                fill="none" stroke="#fff" stroke-width="7"/>
          <path d="M36,30 L36,50 C36,58 42,64 50,64 C58,64 63,58 63,51 C63,47 60,44 56,44 C52,44 50,47 50,50"
                fill="none" stroke="#fff" stroke-width="5.5"/>
          <path d="M43,30 L43,42"
                fill="none" stroke="#fff" stroke-width="5.5"/>
          <circle cx="67" cy="55" r="4.5"
                  fill="none" stroke="#fff" stroke-width="5"/>
        </svg>
      </div>

      <h1 class="hero__title">
        Atención médica inmediata, sin salir de casa.
      </h1>

      <div class="hero__buttons">
        <button class="btn btn--primary">
          ¡REGÍSTRATE CON NOSOTROS!
        </button>

        <button class="btn btn--secondary" id="btnLogin">
          INICIA SESIÓN
        </button>
      </div>

    </div>

    <div class="hero__scroll-indicator"></div>
  </section>

<script>
document.getElementById("btnLogin").addEventListener("click",function(){
    window.location.href="iniciar_sesion.html";
});
</script>

</body>
</html>
