<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedLife | Atención médica virtual inmediata</title>
  <link rel="stylesheet" href="inicio_de_sesion.css">
</head>
<body>

  <div class="page">

    <!-- Encabezado con logotipo -->
    <header class="site-header">
      <a href="#" class="logo" aria-label="MedLife - Inicio">
        <img class="logo__icon" src="assets/logo-badge.png" alt="Logotipo MedLife: corazón con estetoscopio">
        <span class="logo__text">
          <span class="logo__name">MEDLIFE</span>
          <span class="logo__tagline">Virtual Healthcare</span>
        </span>
      </a>
    </header>

    <!-- Sección principal (hero) -->
    <section class="hero" aria-label="Presentación de atención médica virtual">

      <div class="hero__badge" aria-hidden="true">
        <img src="assets/logo-badge.png" alt="">
      </div>

      <div class="hero__content">
        <h1 class="hero__title">Atención médica inmediata,<br>sin salir de casa.</h1>
        <p class="hero__subtitle">Habla con un médico certificado por videollamada, en minutos y desde cualquier lugar.</p>

        <div class="hero__actions">
          <a href="#registro" class="btn btn--primary">Regístrate con nosotros</a>
          <a href="#login" class="btn btn--secondary">Inicia sesión</a>
        </div>
      </div>

    </section>

  </div>

</body>
</html>
