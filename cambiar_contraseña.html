<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDLIFE - Cambiar Contraseña</title>
  <link rel="stylesheet" href="cambiar_contraseña.css">
</head>
<body>

  <div class="cp-page">

    <!-- TOP PHOTO SECTION -->
    <div class="cp-page__photo">
      <div class="cp-page__overlay"></div>

      <div class="cp-navbar">
        <div class="cp-navbar__logo-badge">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M50,90 C22,66 6,46 6,29 C6,15 17,5 31,5 C41,5 47,11 50,19 C53,11 59,5 69,5 C83,5 94,15 94,29 C94,46 78,66 50,90 Z"
                  fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M36,30 L36,50 C36,58 42,64 50,64 C58,64 63,58 63,51 C63,47 60,44 56,44 C52,44 50,47 50,50"
                  fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M43,30 L43,42" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
            <circle cx="67" cy="55" r="5" fill="none" stroke="#ffffff" stroke-width="5.5"/>
          </svg>
        </div>
        <div class="cp-navbar__text">
          <span class="cp-navbar__brand">MEDLIFE</span>
          <span class="cp-navbar__subtitle">VIRTUAL HEALTHCARE</span>
        </div>
      </div>

      <a href="iniciar_sesion.html" class="back-btn" aria-label="Volver">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M15 5 L8 12 L15 19" fill="none" stroke="#ffffff" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>

    <!-- BLUE GRADIENT LOWER SECTION -->
    <div class="cp-page__background">
      <div class="scroll-indicator" aria-hidden="true"></div>
    </div>

    <!-- CHANGE PASSWORD CARD -->
    <div class="cp-card">
      <div class="cp-card__icon">
        <svg class="lock-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="5" y="10" width="14" height="10" rx="2.2" fill="none" stroke="#ffffff" stroke-width="1.8"/>
          <path d="M8 10 V7 a4 4 0 0 1 8 0 V10" fill="none" stroke="#ffffff" stroke-width="1.8"
                stroke-linecap="round"/>
        </svg>
        <div class="cp-card__dots">****</div>
      </div>

      <h1 class="cp-card__title">CAMBIAR CONTRASEÑA</h1>

      <form class="cp-form" action="nueva_contraseña.html" method="get">
        <label class="cp-form__label" for="email">CORREO ELECTRONICO</label>
        <input class="cp-form__input" type="email" id="email" name="email" autocomplete="email" required>

        <label class="cp-form__label" for="code">CÓDIGO DE VERIFICACIÓN</label>
        <input class="cp-form__input" type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required>

        <button type="submit" class="cp-form__submit">CAMBIAR</button>
      </form>
    </div>

  </div>

</body>
</html>
