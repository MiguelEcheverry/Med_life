<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDLIFE - Inicia Sesión</title>
  <link rel="stylesheet" href="iniciar_sesion.css">
</head>
<body>

  <div class="login-page">

    <!-- TOP PHOTO SECTION -->
    <div class="login-page__photo">
      <div class="login-page__overlay"></div>

      <div class="login-navbar">
        <div class="login-navbar__logo-badge">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M50,90 C22,66 6,46 6,29 C6,15 17,5 31,5 C41,5 47,11 50,19 C53,11 59,5 69,5 C83,5 94,15 94,29 C94,46 78,66 50,90 Z"
                  fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M36,30 L36,50 C36,58 42,64 50,64 C58,64 63,58 63,51 C63,47 60,44 56,44 C52,44 50,47 50,50"
                  fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M43,30 L43,42" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
            <circle cx="67" cy="55" r="5" fill="none" stroke="#ffffff" stroke-width="5.5"/>
          </svg>
        </div>
        <div class="login-navbar__text">
          <span class="login-navbar__brand">MEDLIFE</span>
          <span class="login-navbar__subtitle">VIRTUAL HEALTHCARE</span>
        </div>
      </div>

      <button type="button" class="back-btn" aria-label="Volver">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M15 5 L8 12 L15 19" fill="none" stroke="#ffffff" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- BLUE GRADIENT LOWER SECTION -->
    <div class="login-page__background">
      <div class="scroll-indicator" aria-hidden="true"></div>
    </div>

    <!-- LOGIN CARD -->
    <div class="login-card">
      <div class="login-card__icon">
        <svg class="lock-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="5" y="10" width="14" height="10" rx="2.2" fill="none" stroke="#ffffff" stroke-width="1.8"/>
          <path d="M8 10 V7 a4 4 0 0 1 8 0 V10" fill="none" stroke="#ffffff" stroke-width="1.8"
                stroke-linecap="round"/>
        </svg>
        <div class="login-card__dots">****</div>
      </div>

      <h1 class="login-card__title">INICIA SESIÓN</h1>

      <form class="login-form" novalidate>
        <label class="login-form__label" for="email">CORREO ELECTRÓNICO</label>
        <input class="login-form__input" type="email" id="email" name="email" autocomplete="email" required>

        <label class="login-form__label" for="password">CONTRASEÑA</label>
        <input class="login-form__input" type="password" id="password" name="password" autocomplete="current-password" required>

        <button type="submit" class="login-form__submit">ACCESO</button>

        <a href="cambiar_contraseña.html" class="login-form__forgot">¿OLVIDASTE TU CONTRASEÑA?</a>

        <p class="login-form__message" id="formMessage" role="status"></p>
      </form>
    </div>

  </div>

  <script>
    const form = document.querySelector('.login-form');
    const message = document.getElementById('formMessage');
    const backBtn = document.querySelector('.back-btn');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const email = document.getElementById('email');
      const password = document.getElementById('password');

      if (!email.value || !email.validity.valid) {
        message.textContent = 'Por favor ingresa un correo electrónico válido.';
        message.classList.add('is-error');
        email.focus();
        return;
      }

      if (!password.value) {
        message.textContent = 'Por favor ingresa tu contraseña.';
        message.classList.add('is-error');
        password.focus();
        return;
      }

      message.classList.remove('is-error');
      message.textContent = 'Iniciando sesión...';

      // Placeholder for real authentication logic.
      setTimeout(() => {
        message.textContent = 'Sesión iniciada correctamente.';
        window.location.href = 'index.html';
      }, 900);
    });

    backBtn.addEventListener('click', function () {
      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
