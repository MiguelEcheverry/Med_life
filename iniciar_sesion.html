<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicia sesión · MedLife</title>
<link rel="stylesheet" href="iniciar_sesion.css">
</head>
<body class="auth-page">

  <a href="acceso.html" class="back-link" aria-label="Volver al inicio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </a>

  <header class="topbar">
    <a href="acceso.html" class="brand" aria-label="Ir al inicio de MedLife">
      <span class="brand-logo"><assets><img src="assets/img/iniciar sesion/imagen.png" alt="Logo de MedLife"></span>
      <span class="brand-name">
        <strong>MEDLIFE</strong>
        <span>VIRTUAL HEALTHCARE</span>
      </span>
    </a>
  </header>

  <section class="auth-banner">
    <div class="auth-banner-media">
      <img src="https://images.unsplash.com/photo-1551190822-a9333d879b1f?auto=format&fit=crop&w=1600&q=80" alt="Equipo médico revisando información clínica en una pantalla digital">
    </div>
  </section>

  <section class="auth-lower">
    <div class="auth-card">
      <div class="auth-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10" width="16" height="10" rx="2"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
      </div>

      <h2>Inicia sesión</h2>

      <form class="auth-form" action="acceso.html">
        <div class="field">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" placeholder="Correo electrónico" required>
        </div>

        <div class="field">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" placeholder="Contraseña" required>
        </div>

        <a href="inicio.html" class="auth-submit">Acceso</a>
      </form>

      <p class="auth-form-footer">
        <a href="recuperar_contraseña.html">¿Olvidaste tu contraseña?</a>
      </p>
    </div>
  </section>

</body>
</html>
